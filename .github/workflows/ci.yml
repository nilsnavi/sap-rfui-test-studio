name: CI

# Quality gates for the TypeScript layers. Desktop packaging is deliberately
# separate (see desktop-build.yml) because it needs a Windows/MSVC runner.

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture guard
        run: pnpm check:architecture

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: Verify produced bundle layout
        run: test -f apps/desktop/dist/index.html
