[package]
name = "sap-rfui-test-studio"
description = "SAP RFUI Test Studio — desktop test workbench for SAP RFUI screens (foundation build)"
version = "0.1.0"
authors = ["SAP RFUI Test Studio"]
edition = "2021"
rust-version = "1.77.2"

# The Tauri entry point is a thin shell: product behaviour lives in the React
# front-end and in the TypeScript layers, so the Rust side stays minimal.
[lib]
name = "sap_rfui_test_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
