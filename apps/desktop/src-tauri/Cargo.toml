[package]
name = "sap-rfui-test-studio"
description = "SAP RFUI Test Studio — desktop test workbench for SAP RFUI screens (foundation build)"
version = "0.2.0"
authors = ["SAP RFUI Test Studio"]
edition = "2021"
rust-version = "1.77.2"

# The Tauri entry point is a thin shell: product behaviour lives in the React
# front-end and in the TypeScript layers, so the Rust side stays minimal.
[lib]
name = "sap_rfui_test_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"

# SPIKE-001 Path A runtime: WebView2 content capture (CapturePreview) and
# OS-level key injection (SendInput) — the faithful scanner/keyboard path.
# Windows-only, matching the desktop target of the spike.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
